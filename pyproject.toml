[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "outnote-smtp"
version = "0.1.0"
description = "Local SMTP submission bridge for OutNote and Microsoft 365"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["outnote>=1.3,<2", "aiosmtpd>=1.4.6,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
outnote-smtp = "outnote_smtp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/outnote_smtp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
